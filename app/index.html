<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Accueil</title>
<style>html,body{margin:0;background:#000}</style></head>
<body>
<video id="bg" autoplay muted loop playsinline></video>
<canvas id="sky"></canvas>
<nav id="tiles"></nav>
<script>
// Amorceur : ce fichier passe par jsdelivr (cache de 12 h, purge peu fiable), donc il ne change
// jamais. Le vrai code vient de GitHub Pages (bon type MIME), version forcée à chaque lancement.
(function () {
  var base = location.hostname === '127.0.0.1' ? 'https://7007h1355.github.io/tv-launcher/app/' : '';
  var v = '?v=' + Date.now();
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = base + 'style.css' + v;
  document.head.appendChild(css);
  var files = ['debug.js', 'focus.js', 'tiles.js', 'tv.js', 'launcher.js', 'sky.js'];
  (function next(i) {
    if (i === files.length) return;
    var s = document.createElement('script');
    s.src = base + files[i] + v;
    s.onload = function () { next(i + 1); };
    s.onerror = function () { document.body.insertAdjacentHTML('beforeend', '<p style="color:#f88;font:24px sans-serif;position:absolute;top:20px;left:20px">Chargement impossible : ' + files[i] + '</p>'); };
    document.body.appendChild(s);
  })(0);
})();
</script>
</body></html>
